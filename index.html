<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#060a11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="도면 생성기"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}#pin{position:fixed;inset:0;z-index:50;background:#060a11;display:grid;place-items:center;color:#e3f4ff;font-family:"Noto Sans KR",system-ui,sans-serif}#pin .card{display:grid;gap:14px;justify-items:center;width:min(92vw,360px);padding:24px;border:1px solid rgba(94,215,255,.35);border-radius:10px;background:rgba(10,16,26,.85);box-shadow:0 0 36px rgba(94,215,255,.2)}#pin h1{margin:0;font-size:20px;letter-spacing:.06em}#pin p{margin:0;color:#86a3bb;font-size:13px;text-align:center}#pin .dots{display:flex;gap:12px}#pin .dots i{width:14px;height:14px;border-radius:50%;border:1px solid #5ed7ff;display:block}#pin .dots i.on{background:#5ed7ff;box-shadow:0 0 10px #5ed7ff}#pin .keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}#pin .keys button{height:56px;font-size:22px;border-radius:8px;border:1px solid rgba(94,215,255,.3);background:rgba(255,255,255,.03);color:#e3f4ff;font-family:inherit}#pin .keys button:active{background:rgba(94,215,255,.2)}#pin .err{color:#ff8f5e;min-height:18px;font-size:13px}</style></head><body><div id="pin" hidden><div class="card"><h1>도면 생성기</h1><p>본인 확인을 위해 PIN 4자리를 입력하세요.</p><div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div><div class="keys" id="pinKeys"></div><div class="err" id="pinErr"></div></div></div><title>도면 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 홀로그램 콘솔: 어두운 바탕 위 시안 빛 선, 유리 패널, 느린 스캔 애니메이션. 단일 다크 테마(의도된 선택). */
:root{
  --bg:#060a11; --panel:rgba(10,16,26,.78); --panel2:rgba(14,22,36,.9); --fg:#e3f4ff; --muted:#86a3bb; --line:rgba(94,215,255,.22); --line2:rgba(94,215,255,.45);
  --accent:#5ed7ff; --accent-fg:#04131c; --accent2:#ffb36b; --ok:#67e8a9; --soft:rgba(94,215,255,.10); --stage:#04070c;
  --glow:0 0 18px rgba(94,215,255,.35); --glow2:0 0 36px rgba(94,215,255,.25);
  --font:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Rajdhani","Noto Sans KR",system-ui,sans-serif; --mono:"JetBrains Mono","Consolas",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column;min-height:100%;
  background-image:radial-gradient(1200px 600px at 70% -10%,rgba(94,215,255,.10),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(255,179,107,.06),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(94,215,255,.35)}
/* 상단 바 */
header{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(10,16,26,.95),rgba(10,16,26,.7));backdrop-filter:blur(10px);flex-wrap:wrap;position:relative;z-index:5}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:#fff;text-shadow:var(--glow)}
.brand small{display:block;font-family:var(--font);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:none;text-shadow:none}
.steps{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:4px;padding:6px 12px;display:flex;gap:8px;align-items:center;white-space:nowrap;color:var(--muted);font-family:var(--display);font-weight:600;letter-spacing:.04em;position:relative;transition:border-color .25s,box-shadow .25s,color .25s}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:3px;background:var(--soft);color:var(--fg);font-size:11px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.step.on{border-color:var(--accent);color:#fff;box-shadow:var(--glow);background:var(--soft)}
.step.on b{background:var(--accent);color:var(--accent-fg)}
.step.done b{background:var(--ok);color:#04131c}
.step:hover{border-color:var(--line2)}
/* 본문 */
main{flex:1;display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0}
aside{background:var(--panel);backdrop-filter:blur(12px);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.panel{flex:1;overflow:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.04em;text-wrap:balance;color:#fff}
.panel h2::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);box-shadow:var(--glow);margin-right:10px;transform:rotate(45deg);vertical-align:middle}
.panel p{margin:0;color:var(--muted)}
.panel .lead{color:var(--fg)}
.nav{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(6,10,17,.6)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:4px;padding:9px 14px;font-weight:500;position:relative;transition:border-color .2s,box-shadow .2s,background .2s,transform .15s}
.btn:hover{border-color:var(--line2);background:var(--soft);box-shadow:var(--glow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,rgba(94,215,255,.95),rgba(60,180,230,.95));color:var(--accent-fg);border-color:transparent;font-weight:700;letter-spacing:.02em;box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:var(--glow2)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.on{background:var(--soft);color:#fff;border-color:var(--accent);box-shadow:var(--glow)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.cards{display:grid;gap:10px}
.card{text-align:left;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:rgba(255,255,255,.02);display:grid;gap:4px;position:relative;transition:border-color .2s,box-shadow .2s,transform .2s}
.card::before,.card::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--accent);opacity:0;transition:opacity .2s}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.card:hover{border-color:var(--line2);box-shadow:var(--glow);transform:translateY(-1px)}
.card:hover::before,.card:hover::after{opacity:1}
.card b{font-size:15px;color:#fff}
.card span{color:var(--muted);font-size:13px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tools .btn{display:grid;gap:2px;text-align:center;padding:8px 6px;font-size:13px}
.tools .btn small{color:var(--muted);font-size:11px}
.tools .btn.on small{color:inherit;opacity:.85}
.field{display:grid;gap:6px}
.field label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--display);font-weight:600}
.field input[type=number],.field input[type=text],.field select{border:1px solid var(--line);background:rgba(0,0,0,.35);border-radius:4px;padding:8px 10px;width:100%;box-sizing:border-box}
input[type=range]{accent-color:var(--accent)}
.unit{display:flex;align-items:center;gap:6px}
.unit input{flex:1;min-width:0}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{border:1px solid var(--line);border-radius:5px;padding:0;overflow:hidden;background:rgba(0,0,0,.3);display:grid;gap:4px;padding-bottom:4px;transition:border-color .2s,box-shadow .2s}
.sw i{display:block;height:34px}
.sw span{font-size:11px;color:var(--muted);display:block;text-align:center}
.sw.on{border-color:var(--accent);box-shadow:var(--glow)}
.sw.on span{color:var(--fg)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item{border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.02);padding:8px 6px;display:grid;gap:4px;justify-items:center;font-size:12px;transition:border-color .2s,box-shadow .2s,transform .15s}
.item:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateY(-1px)}
.item i{width:38px;height:26px;border-radius:3px;display:block}
.sel{border:1px solid var(--line2);border-radius:6px;padding:10px 12px;display:grid;gap:8px;background:rgba(94,215,255,.06);box-shadow:inset 0 0 24px rgba(94,215,255,.06)}
.sel .name{font-weight:600;color:#fff}
.hint{font-size:12px;color:var(--muted);padding:8px 10px;border-left:2px solid var(--accent);background:rgba(94,215,255,.04)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:rgba(0,0,0,.25)}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--display)}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--accent);text-shadow:var(--glow)}
.chat{display:grid;gap:8px}
.chat .log{display:grid;gap:6px;max-height:160px;overflow:auto}
.bub{padding:7px 10px;border-radius:6px;font-size:13px;max-width:92%}
.bub.me{background:var(--soft);justify-self:end;border:1px solid var(--line)}
.bub.ai{background:rgba(0,0,0,.3);border:1px solid var(--line)}
.chat form{display:flex;gap:6px}
.chat input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.35);border-radius:4px;padding:8px 10px}
table.est{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.est th,table.est td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.est th:first-child,table.est td:first-child{text-align:left}
table.est input{width:92px;border:1px solid var(--line);background:rgba(0,0,0,.35);border-radius:4px;padding:3px 6px;text-align:right;font-family:var(--mono)}
table.est tfoot td{font-weight:700;color:var(--accent);font-family:var(--mono);font-size:15px}
/* 작업대 */
.stage{position:relative;background:var(--stage);min-height:0;min-width:0;overflow:hidden;
  background-image:linear-gradient(rgba(94,215,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(94,215,255,.06) 1px,transparent 1px),radial-gradient(900px 500px at 50% 110%,rgba(94,215,255,.12),transparent 70%);background-size:40px 40px,40px 40px,100% 100%}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,transparent 0%,rgba(94,215,255,.08) 50%,transparent 100%);background-size:100% 220px;animation:scan 7s linear infinite;mix-blend-mode:screen;opacity:.7}
@keyframes scan{from{background-position:0 -220px}to{background-position:0 calc(100% + 220px)}}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
#c2,#c3,#c4{position:absolute;inset:0}
/* 홀로그램 HUD 모서리 */
.hud{position:absolute;inset:10px;pointer-events:none;z-index:3}
.hud i{position:absolute;width:22px;height:22px;border:1.5px solid var(--accent);opacity:.8;filter:drop-shadow(0 0 6px rgba(94,215,255,.6))}
.hud i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.hud i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.hud i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.hud i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.readout{position:absolute;right:14px;top:14px;z-index:3;display:grid;gap:4px;font-family:var(--mono);font-size:11px;color:var(--accent);text-align:right;text-shadow:var(--glow);pointer-events:none;letter-spacing:.04em}
.readout span{opacity:.75;color:var(--muted);text-shadow:none}
.float{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;max-width:60%}
.float .btn{background:var(--panel2);backdrop-filter:blur(8px)}
.zoom{position:absolute;right:14px;bottom:14px;z-index:3;display:grid;gap:4px}
.zoom .btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-family:var(--mono);font-size:18px;background:var(--panel2);backdrop-filter:blur(8px)}
.status{position:absolute;left:14px;bottom:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--fg);z-index:3;max-width:calc(100% - 90px);backdrop-filter:blur(8px);font-family:var(--mono);letter-spacing:.02em}
.status::before{content:"▮ ";color:var(--accent);animation:blink 1.4s steps(2) infinite}
@keyframes blink{to{opacity:.2}}
.toolbar{position:absolute;z-index:4;display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:var(--glow)}
.modal{position:fixed;inset:0;background:rgba(2,5,10,.78);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;padding:16px;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;max-width:960px;width:100%;max-height:100%;overflow:auto;display:grid;gap:12px;padding:18px;box-shadow:var(--glow2);animation:rise .35s both}
.modal img{width:100%;border-radius:4px;display:block;border:1px solid var(--line)}
.modal h2{font-family:var(--display);letter-spacing:.04em;color:#fff}
.prog{height:4px;background:rgba(94,215,255,.12);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#fff);width:0;transition:width .3s;box-shadow:var(--glow)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 8px;color:var(--muted);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.ok{color:var(--ok)}
.sheet{background:#fff;color:#111;border-radius:4px;overflow:auto}
.sheet svg{display:block;width:100%;height:auto}
/* 프레젠테이션(상담) 모드 */
body.present aside,body.present header .steps,body.present #btnReset{display:none}
body.present main{grid-template-columns:1fr}
body.present .present-bar{display:flex}
body.present .zoom{bottom:96px}
body.present .status{display:none}
.present-bar #presentKey.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.present-bar input::placeholder{color:var(--muted);opacity:.95}
body.present .readout{display:none}
.present-bar{display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;box-shadow:var(--glow2);max-width:calc(100% - 32px);width:720px;backdrop-filter:blur(10px)}
.present-bar input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.4);border-radius:4px;padding:10px 12px;font-size:15px}
button{touch-action:manipulation}
.handle{display:none;border:0;background:transparent;padding:6px 0 2px;width:100%;cursor:pointer}
.handle i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto;box-shadow:var(--glow)}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .stage{order:1;min-height:38vh}
  aside{order:2;border-right:0;border-top:1px solid var(--line);max-height:58vh;transition:max-height .25s ease}
  aside.collapsed{max-height:118px}
  aside.half{max-height:40vh}
  aside.collapsed .panel{display:none}
  .handle{display:block}
  .panel{padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
  .nav{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  .btn{min-height:40px}
  .tools .btn{min-height:52px}
  .float{max-width:calc(100% - 28px);gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .float .btn{white-space:nowrap;flex:0 0 auto}
  .float .btn{padding:6px 9px;font-size:12px}
  .readout{display:none}
  .status{top:auto;bottom:12px;left:12px;right:68px;max-width:none;font-size:11px}
  .zoom .btn{width:36px;height:36px}
  .hud{inset:6px}
  .present-bar{width:calc(100% - 24px);bottom:12px}
  header{gap:8px;padding-block:8px;row-gap:6px}
  .brand{font-size:17px}
  .brand small{display:none}
  .steps{order:3;flex-basis:100%;gap:4px;padding-bottom:2px}
  .step{padding:7px 10px;font-size:13px;flex:1 0 auto;justify-content:center}
  .step b{width:18px;height:18px;font-size:10px}
  #btnPresent,#btnReset{padding:6px 10px;font-size:12px;min-height:34px}
  .modal{padding:8px}
  .modal .box{padding:12px;gap:10px}
  .catalog{grid-template-columns:repeat(4,1fr)}
  .swatches{grid-template-columns:repeat(5,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} .stage::before{display:none} }
</style>

<header>
  <div class="brand">뚝딱 인테리어<small>그리면 바로 3D, 가구와 조명까지</small></div>
  <nav class="steps" id="steps" aria-label="단계"></nav>
  <button class="btn sm" id="btnShare" title="작업 저장·불러오기·휴대폰으로 공유">저장·공유</button>
  <button class="btn sm" id="btnPresent" title="패널을 숨기고 3D만 크게 보여 줍니다">상담 모드</button>
  <button class="btn sm ghost" id="btnReset" title="처음부터 다시">초기화</button>
</header>

<main>
  <aside id="aside">
    <button class="handle" id="sheetToggle" aria-label="메뉴 접기/펼치기"><i></i></button>
    <div class="panel" id="panel"></div>
    <div class="nav">
      <button class="btn" id="btnPrev">이전</button>
      <span class="grow"></span>
      <button class="btn primary" id="btnNext">다음</button>
    </div>
  </aside>
  <section class="stage" id="stage">
    <canvas id="c2"></canvas>
    <canvas id="c3" hidden></canvas>
    <div class="hud" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="readout" id="readout" aria-live="polite"></div>
    <div class="float" id="float"></div>
    <div class="zoom" id="zoom"><button class="btn" id="zIn" title="확대">+</button><button class="btn" id="zOut" title="축소">−</button><button class="btn" id="zFit" title="전체 보기" style="font-size:13px">⤢</button></div>
    <div class="status" id="status">시작 방법을 고르세요.</div>
    <div class="present-bar" id="presentBar"><input type="text" id="presentCmd" placeholder="말로 수정: “오른쪽 끝 방에 문 넣어줘”, “복도 1.5 m로”, “벽을 베이지로”" autocomplete="off"><button class="btn primary" id="presentGo">적용</button><button class="btn" id="presentKey" title="Claude API 키 연결">🔑</button><button class="btn" id="presentExit">나가기</button></div>
